<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 370" width="648" height="370" role="img" aria-label="이전 작업 재사용 흐름도. 새 지시를 이전 작업 파일과 글자 유사도로 비교해 거의 같은 작업이면 사람에게 재사용 여부를 묻고, 비슷한 작업이면 작업 파일과 산출물을 새 지시서에 참조로 붙인다." font-family='"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif'>
