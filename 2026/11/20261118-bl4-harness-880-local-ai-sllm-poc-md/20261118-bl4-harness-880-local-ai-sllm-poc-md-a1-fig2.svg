<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 336" width="648" height="336" role="img" aria-label="VRAM과 양자화 관계 흐름도. VRAM이 크면 양자화를 적게 한 큰 모델을 올려 한 번에 작업하고 그것이 비용 절감으로 이어진다. 양자화를 많이 하면 메모리는 덜 쓰지만 품질이 떨어진다." font-family='"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif'>
<title>VRAM과 양자화 관계 흐름도. VRAM이 크면 양자화를 적게 한 큰 모델을 올려 한 번에 작업하고 그것이 비용 절감으로 이어진다. 양자화를 많이 하면 메모리는 덜 쓰지만 품질이 떨어진다.</title>
