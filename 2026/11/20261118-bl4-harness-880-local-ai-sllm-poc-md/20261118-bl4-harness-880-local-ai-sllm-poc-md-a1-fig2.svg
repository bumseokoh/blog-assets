<line x1="24.0" y1="50.0" x2="312.0" y2="50.0" stroke="#c9cdd3" stroke-width="2"/>
<rect x="24.0" y="66.0" width="288.0" height="56.0" rx="10" fill="#e8f0fa" stroke="#1c5aa6" stroke-width="2" data-mark="node"/>
<text x="168.0" y="103.0" font-size="26" font-weight="700" fill="#1c5aa6" text-anchor="middle">양자화 적게 한 큰 모델</text>
