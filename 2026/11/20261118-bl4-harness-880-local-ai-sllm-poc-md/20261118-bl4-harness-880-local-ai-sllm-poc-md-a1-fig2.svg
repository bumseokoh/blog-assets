<text x="480.0" y="103.0" font-size="26" font-weight="700" fill="#24272b" text-anchor="middle">메모리 덜 사용</text>
<line x1="480.0" y1="126.0" x2="480.0" y2="158.0" stroke="#5f6368" stroke-width="2.5" marker-end="url(#ah)" data-mark="arrow"/>
<rect x="336.0" y="162.0" width="288.0" height="56.0" rx="10" fill="#fbe9e7" stroke="#b3261e" stroke-width="2" data-mark="node"/>
