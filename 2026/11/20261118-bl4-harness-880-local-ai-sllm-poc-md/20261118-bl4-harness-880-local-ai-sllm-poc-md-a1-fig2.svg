<text x="168.0" y="199.0" font-size="26" font-weight="700" fill="#1c5aa6" text-anchor="middle">한 번에 작업</text>
<line x1="168.0" y1="222.0" x2="168.0" y2="254.0" stroke="#5f6368" stroke-width="2.5" marker-end="url(#ah)" data-mark="arrow"/>
<rect x="24.0" y="258.0" width="288.0" height="56.0" rx="10" fill="#e6f2eb" stroke="#17663f" stroke-width="2" data-mark="node"/>
<text x="168.0" y="295.0" font-size="26" font-weight="700" fill="#17663f" text-anchor="middle">비용 절감</text>
<text x="480.0" y="38.0" font-size="28" font-weight="700" fill="#24272b" text-anchor="middle">양자화를 많이 하면</text>
<line x1="336.0" y1="50.0" x2="624.0" y2="50.0" stroke="#c9cdd3" stroke-width="2"/>
