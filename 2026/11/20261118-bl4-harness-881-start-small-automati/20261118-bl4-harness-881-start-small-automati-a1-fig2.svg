<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 432" width="648" height="432" role="img" aria-label="스크립트로 묶는 규칙 흐름도. 같은 모양의 작업이 두 번째로 나오면 기록하고 스크립트 후보로 올리고, 세 번째가 오기 전에 스크립트로 만든다. 그 뒤에는 스크립트를 실행하고 AI는 출력만 판단한다." font-family='"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif'>
<title>스크립트로 묶는 규칙 흐름도. 같은 모양의 작업이 두 번째로 나오면 기록하고 스크립트 후보로 올리고, 세 번째가 오기 전에 스크립트로 만든다. 그 뒤에는 스크립트를 실행하고 AI는 출력만 판단한다.</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="648" height="432" fill="#ffffff"/>
<text x="324.0" y="38.0" font-size="28" font-weight="700" fill="#24272b" text-anchor="middle">같은 모양의 작업</text>
<line x1="104.0" y1="50.0" x2="544.0" y2="50.0" stroke="#c9cdd3" stroke-width="2"/>
