<text x="324.0" y="103.0" font-size="26" font-weight="700" fill="#24272b" text-anchor="middle">두 번째: 기록·후보 등록</text>
<line x1="324.0" y1="126.0" x2="324.0" y2="158.0" stroke="#5f6368" stroke-width="2.5" marker-end="url(#ah)" data-mark="arrow"/>
<rect x="104.0" y="162.0" width="440.0" height="56.0" rx="10" fill="#e8f0fa" stroke="#1c5aa6" stroke-width="2" data-mark="node"/>
<text x="324.0" y="199.0" font-size="26" font-weight="700" fill="#1c5aa6" text-anchor="middle">세 번째 전: 스크립트로</text>
<line x1="324.0" y1="222.0" x2="324.0" y2="254.0" stroke="#5f6368" stroke-width="2.5" marker-end="url(#ah)" data-mark="arrow"/>
<rect x="104.0" y="258.0" width="440.0" height="56.0" rx="10" fill="#e8f0fa" stroke="#1c5aa6" stroke-width="2" data-mark="node"/>
<text x="324.0" y="295.0" font-size="26" font-weight="700" fill="#1c5aa6" text-anchor="middle">스크립트 실행</text>
<line x1="324.0" y1="318.0" x2="324.0" y2="350.0" stroke="#5f6368" stroke-width="2.5" marker-end="url(#ah)" data-mark="arrow"/>
